<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        #angka {
            font-size: 48px;
            margin: 20px 0;
            color: #007BFF;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }
        #kurang { background-color: #dc3545; }
        #tambah { background-color: #28a745; }
        #reset { background-color: #6c757d; }
    </style>
</head>
<body>

    <h1>Aplikasi Penghitung Angka</h1>
    <div id="angka">0</div>
    
    <button id="kurang">Kurang (-)</button>
    <button id="reset">Reset</button>
    <button id="tambah">Tambah (+)</button>

    <!-- Menghubungkan file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
